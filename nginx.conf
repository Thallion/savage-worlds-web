# --- Rate-Limiting ---
# Öffentlicher Zugang läuft über den Cloudflare-Tunnel: $remote_addr ist dann
# immer der cloudflared-Container. Die echte Client-IP steht in
# CF-Connecting-IP; direkte Zugriffe im LAN (Port 80) fallen auf $remote_addr zurück.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Allgemeine API: jede Editor-Aktion erzeugt ~2 Anfragen (Aktion + /berechne),
# schnelles Klicken bleibt über den Burst gedeckt.
limit_req_zone $client_ip zone=api:10m rate=10r/s;
# Login/Registrierung: gegen Passwort-Raten deutlich strenger.
limit_req_zone $client_ip zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 429 als JSON, damit das Frontend (api/client.ts liest "detail") eine
    # verständliche Meldung anzeigt statt "Fehler bei der Anfrage".
    error_page 429 = @zu_viele_anfragen;
    location @zu_viele_anfragen {
        default_type application/json;
        return 429 '{"detail":"Zu viele Anfragen – bitte einen Moment warten."}';
    }

    # Nur Login/Registrierung — /api/auth/me läuft bei jedem Seitenaufruf
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        # Porträt-Uploads (Backend-Limit 8 MB, Frontend skaliert vorher herunter);
        # der Nginx-Standard von 1 MB würde sie mit 413 abweisen.
        client_max_body_size 10m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
