services:
  backend:
    build: .
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    environment:
      - CHARGEN_SECRET_KEY=${CHARGEN_SECRET_KEY:-change-me-in-production}
      - CHARGEN_DATABASE_URL=sqlite:///./data/chargen.db
    restart: unless-stopped

  nginx:
    build:
      context: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped

  # Öffentlicher Zugang per Cloudflare-Tunnel — kein Portforwarding/DynDNS nötig.
  #
  # Feste Domain (Named Tunnel): https://sw-char-generator.org
  #   - TUNNEL_TOKEN muss in .env stehen (aus Cloudflare Zero Trust, siehe README/Memory).
  #   - Das Public-Hostname-Routing (sw-char-generator.org → http://nginx:80) wird
  #     im Cloudflare-Dashboard des Tunnels konfiguriert, nicht hier.
  #
  # Fallback ohne Token → Quick-Tunnel mit wechselnder …trycloudflare.com-URL
  #   (URL steht dann im Log:  docker compose logs cloudflared)
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - nginx
    restart: unless-stopped
