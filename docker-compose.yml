services:
  backend:
    build: .
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    environment:
      - CHARGEN_SECRET_KEY=${CHARGEN_SECRET_KEY:-change-me-in-production}
      - CHARGEN_DATABASE_URL=sqlite:///./data/chargen.db
    restart: unless-stopped

  nginx:
    build:
      context: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped

  # Öffentlicher Zugang per Cloudflare-Tunnel — kein Portforwarding/DynDNS nötig.
  #
  # Standard: Quick-Tunnel → wechselnde https://<zufall>.trycloudflare.com-URL
  #   (URL steht im Log:  docker compose logs cloudflared)
  #
  # Feste URL (named tunnel): setzt eine eigene Domain bei Cloudflare voraus.
  #   1) In Cloudflare Zero Trust einen Tunnel anlegen und Token kopieren.
  #   2) TUNNEL_TOKEN in .env setzen und 'command' unten ersetzen durch:
  #        command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    restart: unless-stopped
