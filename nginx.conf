# --- Rate-Limiting ---
# Öffentlicher Zugang läuft über den Cloudflare-Tunnel: $remote_addr ist dann
# immer der cloudflared-Container. Die echte Client-IP steht in
# CF-Connecting-IP; direkte Zugriffe (Port 80, nur lokal auf dem Pi) fallen auf $remote_addr zurück.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Allgemeine API: jede Editor-Aktion erzeugt ~2 Anfragen (Aktion + /berechne),
# schnelles Klicken bleibt über den Burst gedeckt.
limit_req_zone $client_ip zone=api:10m rate=10r/s;
# Login/Registrierung: gegen Passwort-Raten deutlich strenger.
limit_req_zone $client_ip zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Sicherheits-Header ---
    # Gelten für alle Antworten, solange keine location eigene add_header setzt
    # (nginx erbt add_header sonst nicht). Der Login-Token liegt im
    # localStorage — die CSP ist daher die wichtigste Bremse gegen XSS.
    #   style-src 'unsafe-inline': Vuetify setzt Theme/Layout per style-Attribut
    #   fonts.googleapis/gstatic: Cinzel + EB Garamond (index.html)
    #   img-src blob:/data:: Porträt-Vorschau beim Upload, Icons im Charakterbogen
    #   Der Charakterbogen (window.open + document.write) erbt diese CSP — er
    #   enthält nur Inline-Styles und data:-Bilder, keine Skripte.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # 429 als JSON, damit das Frontend (api/client.ts liest "detail") eine
    # verständliche Meldung anzeigt statt "Fehler bei der Anfrage".
    error_page 429 = @zu_viele_anfragen;
    location @zu_viele_anfragen {
        default_type application/json;
        return 429 '{"detail":"Zu viele Anfragen – bitte einen Moment warten."}';
    }

    # Nur Login/Registrierung — /api/auth/me läuft bei jedem Seitenaufruf
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        # Porträt-Uploads (Backend-Limit 8 MB, Frontend skaliert vorher herunter);
        # der Nginx-Standard von 1 MB würde sie mit 413 abweisen.
        client_max_body_size 10m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
