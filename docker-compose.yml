services:
  backend:
    build: .
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    environment:
      - CHARGEN_SECRET_KEY=${CHARGEN_SECRET_KEY:-change-me-in-production}
      - CHARGEN_DATABASE_URL=sqlite:///./data/chargen.db
    restart: unless-stopped

  nginx:
    build:
      context: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped

  # Öffentlicher Zugang per Cloudflare Named Tunnel — feste Domain
  # (https://sw-char-generator.org), kein Portforwarding/DynDNS nötig.
  #
  # Voraussetzungen (einmalig in Cloudflare Zero Trust):
  #   - Domain als Site in Cloudflare, Nameserver umgestellt.
  #   - Tunnel „savage-worlds" (Typ cloudflared) angelegt, Token kopiert.
  #   - Public Hostname des Tunnels: sw-char-generator.org → Service HTTP →
  #     http://nginx:80 (im Dashboard konfiguriert, nicht hier). nginx ist im
  #     selben Compose-Netz erreichbar.
  #
  # Auf dem Pi nur den Token bereitstellen: TUNNEL_TOKEN=<token> in .env.
  # cloudflared läuft ausschließlich hier im Container — kein zusätzlicher
  # systemd-Dienst (sonst zweiter Connector → sporadische 502).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - nginx
    restart: unless-stopped
